name: CI / CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Backend Tests
        run: |
          cd backend
          mvn test -B

      - name: Build Backend Artifact
        run: |
          cd backend
          mvn clean package -DskipTests -B

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  docker-build-verification:
    name: Docker Container Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t distributed-job-backend:ci backend/

      - name: Build Frontend Docker Image
        run: docker build -t distributed-job-frontend:ci frontend/
