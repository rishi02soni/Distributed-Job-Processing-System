server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: distributed-job-processing-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jobprocessing}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        job.processing.duration: true
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  queue:
    stream-name: job:stream
    group-name: worker-group
    dlq-stream-name: job:stream:dlq
    delayed-zset-name: job:delayed
    poll-batch-size: 10
    poll-timeout-ms: 2000
  worker:
    enabled: ${WORKER_ENABLED:true}
    concurrency: ${WORKER_CONCURRENCY:4}
    default-max-retries: ${DEFAULT_MAX_RETRIES:3}
    backoff-base-ms: ${BACKOFF_BASE_MS:2000}
    backoff-multiplier: ${BACKOFF_MULTIPLIER:2.0}
    job-timeout-seconds: ${JOB_TIMEOUT_SECONDS:60}
    heartbeat-interval-ms: ${HEARTBEAT_INTERVAL_MS:5000}
    dead-worker-threshold-seconds: ${DEAD_WORKER_THRESHOLD_SECONDS:30}
    recovery-interval-ms: ${RECOVERY_INTERVAL_MS:10000}

logging:
  level:
    root: INFO
    com.jobprocessing: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
