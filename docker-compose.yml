version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: jobds-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobprocessing
    volumes:
      - mongodb_data:/data/db
    networks:
      - jobds-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobds-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jobds-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobds-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/jobprocessing
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ENABLED=true
      - WORKER_CONCURRENCY=4
      - DEFAULT_MAX_RETRIES=3
      - BACKOFF_BASE_MS=2000
      - JOB_TIMEOUT_SECONDS=60
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobds-network

  worker-secondary:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobds-worker-secondary
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/jobprocessing
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ENABLED=true
      - WORKER_CONCURRENCY=4
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - jobds-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobds-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jobds-network

  prometheus:
    image: prom/prometheus:latest
    container_name: jobds-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - jobds-network

  grafana:
    image: grafana/grafana:latest
    container_name: jobds-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - jobds-network

networks:
  jobds-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:
