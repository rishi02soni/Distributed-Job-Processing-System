apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: job-processing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: distributed-job-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jobds-config
          env:
            - name: WORKER_ENABLED
              value: "true"
            - name: WORKER_CONCURRENCY
              value: "6"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1200m"
              memory: "1024Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: job-processing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
